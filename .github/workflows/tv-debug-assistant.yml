name: TV Debug Assistant APK
on:
  workflow_dispatch:
  push:
    branches: [ feature/tv-debug-assistant-0.1 ]
    paths:
      - 'tools/tv-debug-assistant/**'
      - '.github/workflows/tv-debug-assistant.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Build debug APK
        working-directory: tools/tv-debug-assistant
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Debug-Assistant-0.1
          path: tools/tv-debug-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
